<!DOCTYPE html>
<html lang="it" style="color-scheme: dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyMesh — Walkthrough</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
  :root {
    --bg:#000000; --surface:#0a0a0a; --raised:#141414; --border:#2a2a2a;
    --fg:#ffffff; --muted:#a0a0a0; --accent:#a855f7; --file:#c084fc; --red:#ef4444;
    --tcp:#f59e0b; --local:#a855f7; --shared:#22d3ee;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
  body { display:flex; flex-direction:column; overflow:hidden; }

  header { padding:12px 20px 8px; border-bottom:1px solid var(--border); background:var(--surface); flex:0 0 auto; }
  header h1 { margin:0; font-size:1rem; font-weight:600; }
  header p { margin:2px 0 8px; font-size:.82rem; color:var(--muted); }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tab { padding:5px 12px; font-size:.8rem; border:1px solid var(--border); border-radius:999px;
    background:var(--raised); color:var(--muted); cursor:pointer; }
  .tab:hover { color:var(--fg); }
  .tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }

  main { flex:1 1 auto; display:flex; min-height:0; }
  #viewport { flex:1 1 auto; position:relative; overflow:hidden; cursor:grab; background:var(--bg); }
  #viewport.dragging { cursor:grabbing; }
  #canvas { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; padding:40px; }
  .mermaid-wrap svg { max-width:none !important; height:auto !important; }
  .mermaid-wrap .node { cursor:pointer; }
  .mermaid-wrap .node:hover rect, .mermaid-wrap .node:hover polygon,
  .mermaid-wrap .node:hover .label-container { filter:brightness(1.3); transition:filter .15s; }
  .mermaid-wrap .node.dim { opacity:.35; }

  #tldr { position:absolute; left:16px; top:12px; z-index:5; max-width:520px; padding:10px 14px;
    background:rgba(10,10,10,.85); backdrop-filter:blur(6px); border:1px solid var(--border);
    border-radius:10px; font-size:.82rem; color:var(--muted); line-height:1.5; cursor:pointer; }
  #tldr.collapsed { padding:5px 12px; border-radius:999px; font-size:.75rem; }
  #tldr b { color:var(--fg); }

  #legend { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:5;
    display:flex; gap:14px; flex-wrap:wrap; justify-content:center; padding:7px 14px;
    background:var(--surface); border:1px solid var(--border); border-radius:10px; font-size:.72rem; color:var(--muted); }
  #legend span { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .line { width:22px; height:0; border-top:3px solid; display:inline-block; }
  .line.dashed { border-top-style:dashed; border-top-width:2px; }

  #zoom { position:absolute; left:16px; bottom:14px; z-index:5; display:flex; gap:4px; }
  #zoom button, #zoom span { background:var(--surface); border:1px solid var(--border); color:var(--muted);
    border-radius:6px; padding:4px 9px; font-size:.78rem; cursor:pointer; min-width:34px; text-align:center; }
  #zoom button:hover { color:var(--fg); background:var(--raised); }
  #hint { position:absolute; right:16px; bottom:14px; z-index:5; font-size:.7rem; color:var(--muted); opacity:.6; }
  kbd { border:1px solid var(--border); border-radius:4px; padding:0 4px; font-size:.68rem; }

  #panel { flex:0 0 540px; max-width:46vw; border-left:1px solid var(--border); background:var(--surface);
    overflow-y:auto; padding:18px 20px 40px; }
  #panel h2 { margin:0 0 6px; font-size:1.05rem; }
  #panel h3 { margin:16px 0 6px; font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); }
  #panel p, #panel li { font-size:.85rem; line-height:1.6; color:#d4d4d4; }
  #panel p { margin:0 0 8px; }
  #panel ul { margin:0; padding-left:18px; }
  #panel ul.plain { list-style:none; padding:0; }
  #panel ul.plain li { margin:0 0 5px; }
  #panel code { background:rgba(168,85,247,.12); padding:1px 5px; border-radius:4px;
    font-family:"SF Mono","Fira Code",Menlo,monospace; font-size:.78rem; color:var(--file); }
  #panel .files code { display:block; background:none; padding:0; margin-bottom:3px; }
  #panel pre, #panel .shiki { background:#000 !important; border:1px solid var(--border); border-radius:8px;

  #panel pre code, #panel .shiki code { background:none; padding:0; font-size:.74rem; line-height:1.5; color:#e0e0e0; }
  .badge { display:inline-block; font-size:.65rem; font-weight:600; letter-spacing:.04em; padding:1px 6px;
    border-radius:4px; margin-right:6px; vertical-align:middle; text-transform:uppercase; }
  .badge.tcp { background:rgba(245,158,11,.18); color:var(--tcp); border:1px solid var(--tcp); }
  .badge.local { background:rgba(168,85,247,.18); color:var(--local); border:1px solid var(--local); }
  .badge.shared { background:rgba(34,211,238,.18); color:var(--shared); border:1px solid var(--shared); }
  .badge.spec { background:rgba(160,160,160,.15); color:var(--muted); border:1px solid var(--muted); }
  .index-item { display:block; width:100%; text-align:left; background:var(--raised); border:1px solid var(--border);
    color:var(--fg); border-radius:8px; padding:8px 10px; margin-bottom:6px; cursor:pointer; font-size:.83rem; }
  .index-item:hover { border-color:var(--accent); }
  .index-item small { display:block; color:var(--muted); font-size:.72rem; margin-top:2px; }
  .nav { display:flex; gap:6px; margin-bottom:10px; }
  .nav button { background:var(--raised); border:1px solid var(--border); color:var(--muted);
    border-radius:6px; padding:4px 9px; font-size:.75rem; cursor:pointer; }
  .nav button:hover { color:var(--fg); }
  .q li { margin-bottom:6px; }
  .muted { color:var(--muted); font-size:.78rem; }
  @media (max-width: 900px) {
    main { flex-direction:column; }
    #panel { flex:0 0 45%; max-width:none; border-left:none; border-top:1px solid var(--border); }
  }
</style>
</head>
<body>

const TALK = { tcp:'TCP', local:'chiamata locale', shared:'memoria condivisa (thread)', spec:'specifica / test' };

const ARCH_DIAGRAM = `

const ARCH_NODES = {

      { kind:'shared', text:"→ crea <code>job_queue</code> e <code>completion</code>, poi li passa a ogni thread <code>handle_connection</code>." },

    code: `def run(listener_sock, job_queue, num_workers):

    talks: [

    title: "Stato condiviso di completamento",
    what: "Un dict creato da <code>_make_completion(total_jobs)</code> e condiviso fra tutti i thread: <code>total</code>, <code>completed</code>, <code>results</code> (job_id → report), un <code>Lock</code>, una <code>Condition</code> costruita sullo stesso lock e un <code>Event done</code>. <code>_mark_result</code> registra il primo report per job_id e ignora i duplicati; quando <code>completed == total</code> imposta <code>done</code> e sveglia tutti.",

    talks: [

      { kind:'local', text:"→ <code>run()</code> legge <code>completed</code>/<code>total</code> e restituisce <code>results</code>." },
    ],
    io: "<b>Entra:</b> (job_id, report) dai thread. <b>Esce:</b> <code>results</code> canonici, segnale <code>done</code>.",
    files: ["studymesh/controller.py:74-97"],
    code: `def _make_completion(total_jobs):
    lock = threading.Lock()
    completion = {
        "total": total_jobs,
        "completed": 0,
        "results": {},
        "lock": lock,
        "condition": threading.Condition(lock),
        "done": threading.Event(),
    }
    if total_jobs == 0:
        completion["done"].set()
    return completion


def _mark_result(completion, job_id, report):
    with completion["condition"]:
        if job_id in completion["results"]:
            return
        completion["results"][job_id] = report
        completion["completed"] += 1
        if completion["completed"] == completion["total"]:
            completion["done"].set()
            completion["condition"].notify_all()`,

/* ---------------------- VISTE ---------------------------------------- */
const VIEWS = {

    tldr:"<b>StudyMesh</b> è un controller TCP che distribuisce documenti Markdown a N worker identici. Il controller carica i file in una <b>coda</b>, accetta N connessioni e avvia <b>un thread per connessione</b>; ogni worker chiede lavoro con READY, riceve JOB/WORK, chiama <b>localmente</b> l'analyzer e rimanda RESULT. Solo le frecce spesse arancioni attraversano TCP; tutto il resto è chiamata di funzione o memoria condivisa fra thread.",
    legend:[ {dot:'#a855f7',label:'Processo / ruolo'}, {dot:'#7c3aed',label:'Thread'}, {dot:'#6d28d9',label:'Modulo puro'}, {dot:'#0e7490',label:'Dato / stato'}, {dot:'#525252',label:'Rete'},
             {line:'#f59e0b',label:'══ TCP (byte sul cavo)'}, {line:'#a0a0a0',label:'── chiamata locale'}, {line:'#a0a0a0',dashed:true,label:'╌╌ memoria condivisa'} ] },
  seq: { label:"2 · Job normale", diagram: SEQ_DIAGRAM, steps: SEQ_STEPS,
    tldr:"Ciclo <b>REGISTER → READY → JOB/WORK → RESULT → READY → … → JOB/DONE</b>. Ogni messaggio marcato <b>[TCP]</b> è un frame <code>[4 byte N][JSON]</code> sul socket; ogni passo <b>[locale]</b> è una chiamata di funzione nel processo indicato. <code>analyze()</code> non attraversa mai la rete.",
    legend:[ {line:'#f59e0b',label:'[TCP] attraversa il socket'}, {line:'#a855f7',label:'[locale] stesso processo'}, {line:'#22d3ee',label:'sotto lock condiviso'} ] },
  fail: { label:"3 · Worker cade", diagram: FAIL_DIAGRAM, steps: FAIL_STEPS,
    tldr:"Il worker A muore con il job 7 attivo. Il controller lo rileva solo perché <code>recv()</code> restituisce zero byte (EOF). Il <b>finally</b> di handle_connection rimette il job in coda <b>una sola volta</b> (se non già completato) e sveglia il worker B in attesa, che lo completa. Semantica <b>at-least-once</b> + risultato canonico.",
    legend:[ {line:'#f59e0b',label:'[TCP]'}, {line:'#a855f7',label:'[locale]'}, {line:'#22d3ee',label:'sotto lock'} ] },

    legend:[ {dot:'#a855f7',label:'processo'}, {dot:'#6d28d9',label:'modulo puro'}, {dot:'#525252',label:'stdlib'}, {dot:'#1f2937',label:'spec / test'}, {line:'#a0a0a0',label:'── import'}, {line:'#a0a0a0',dashed:true,label:'╌╌ normativo / verifica'} ] },

/* =====================================================================
   RENDERING
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const viewport = $('#viewport'), canvas = $('#canvas'), diagramEl = $('#diagram'), panel = $('#panel');
let current = 'arch', activeId = null;

/* Shiki opzionale: se il CDN non risponde, fallback a <pre> semplice */
let highlighter = null;
try {
  const shiki = await import('https://cdn.jsdelivr.net/npm/shiki@3/+esm');
  highlighter = await shiki.createHighlighter({ themes:['vitesse-dark'], langs:['python','markdown'] });
} catch (e) { console.warn('Shiki non disponibile, uso fallback:', e); }

function dedent(code) {
  const lines = code.split('\n');
  const ind = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
  return lines.map(l => l.slice(ind)).join('\n');
}

function codeHtml(code, lang) {
  code = dedent(code);
  if (highlighter) {
    try { return highlighter.codeToHtml(code, { lang: lang || 'python', theme:'vitesse-dark' }); } catch (e) {}
  }
  const pre = document.createElement('pre'); const c = document.createElement('code'); c.textContent = code; pre.appendChild(c);
  return pre.outerHTML;
}

const MERMAID_BASE = {
  startOnLoad:false, theme:'dark', securityLevel:'loose',
  themeVariables: {
    primaryColor:'#0a0a0a', primaryTextColor:'#ffffff', primaryBorderColor:'#2a2a2a',
    lineColor:'#a0a0a0', background:'#000000', secondaryColor:'#000000', tertiaryColor:'#000000',
    mainBkg:'#0a0a0a', nodeBorder:'#2a2a2a', clusterBkg:'rgba(10,10,10,0.8)', clusterBorder:'#7c3aed',
    titleColor:'#ffffff', edgeLabelBackground:'#000000',
    actorBkg:'#141414', actorBorder:'#a855f7', actorTextColor:'#ffffff', actorLineColor:'#555',
    signalColor:'#ffffff', signalTextColor:'#ffffff', noteBkgColor:'#1f2937', noteTextColor:'#e5e7eb', noteBorderColor:'#22d3ee',
    sequenceNumberColor:'#000',
  },
  flowchart: { useMaxWidth:false, htmlLabels:true, curve:'basis' },
  sequence: { useMaxWidth:false, mirrorActors:false, messageFontSize:13, noteFontSize:12, actorFontSize:13, wrap:true, width:210 },
};

window.nodeClick = (id) => showItem(id);

async function renderView(name) {
  current = name; activeId = null;
  const v = VIEWS[name];
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === name));
  $('#tldr').innerHTML = v.tldr; $('#tldr').classList.remove('collapsed');
  $('#legend').innerHTML = v.legend.map(l => l.dot
      ? `<span><i class="dot" style="background:${l.dot}"></i>${l.label}</span>`
      : `<span><i class="line ${l.dashed?'dashed':''}" style="border-color:${l.line}"></i>${l.label}</span>`).join('');
  mermaid.initialize(MERMAID_BASE);
  diagramEl.innerHTML = '';
  try {
    const { svg, bindFunctions } = await mermaid.render('wt-' + name + '-' + Date.now(), v.diagram);
    diagramEl.innerHTML = svg; bindFunctions?.(diagramEl);
  } catch (e) {
    diagramEl.innerHTML = `<pre style="color:#ef4444;padding:20px">Errore Mermaid: ${String(e)}</pre>`;
  }
  // Le sequence diagram di Mermaid non hanno click: i passi si scelgono dal pannello.
  if (v.steps) {
    diagramEl.querySelectorAll('.messageText').forEach((t, i) => {
      t.style.cursor = 'pointer';
      t.addEventListener('click', () => { const idx = tcpIndexToStep(i); if (idx != null) showItem(idx); });
    });
  }
  showIndex();
  setTimeout(fit, 80);
}

/* Le frecce del sequence diagram non corrispondono 1:1 ai passi; il click
   sul testo di una freccia apre il passo più vicino in base alla mappa sotto. */
const SEQ_ARROW_TO_STEP = { seq:[ 's1','s2','s3','s4','s4','s5','s6','s6','s7','s8','s9','s9','s10' ],
                            fail:[ 'f1','f1','f1','f2','f2','f3','f4','f4','f4','f5','f5','f6','f6','f6','f6' ] };
function tcpIndexToStep(i) { const m = SEQ_ARROW_TO_STEP[current]; return m ? m[Math.min(i, m.length-1)] : null; }

function items() { const v = VIEWS[current]; return v.nodes ? v.nodes : Object.fromEntries(v.steps.map(s => [s.id, s])); }
function itemOrder() { return Object.keys(items()); }

function showIndex() {
  activeId = null; dimNodes(null);
  const v = VIEWS[current]; const list = items();
  const isSteps = !!v.steps;
  panel.innerHTML = `<h2>${v.label}</h2>
    <p class="muted">${isSteps ? 'Segui i passi in ordine (o usa ← →). Ogni passo dice se attraversa TCP o resta locale.' : 'Clicca un nodo del diagramma o un elemento qui sotto.'}</p>
    ${Object.entries(list).map(([id, it]) => `<button class="index-item" data-id="${id}">
      ${it.kind ? `<span class="badge ${it.kind}">${TALK[it.kind]}</span>` : ''}${it.title}
      <small>${(it.files||[]).join(' · ')}</small></button>`).join('')}`;
  panel.querySelectorAll('.index-item').forEach(b => b.addEventListener('click', () => showItem(b.dataset.id)));
}

function dimNodes(id) {
  diagramEl.querySelectorAll('.node').forEach(n => n.classList.toggle('dim', !!id && !n.id.includes('-' + id + '-')));
}

function showItem(id) {
  const it = items()[id]; if (!it) return;
  activeId = id; dimNodes(id);
  const order = itemOrder(), i = order.indexOf(id);
  const sec = (h, body) => body ? `<h3>${h}</h3>${body}` : '';
  panel.innerHTML = `
    <div class="nav">
      <button id="navIdx">☰ Indice</button>
      <button id="navPrev" ${i<=0?'disabled':''}>← Prec.</button>
      <button id="navNext" ${i>=order.length-1?'disabled':''}>Succ. →</button>
    </div>
    <h2>${it.kind ? `<span class="badge ${it.kind}">${TALK[it.kind]}</span>` : ''}${it.title}</h2>
    ${sec('Che cos’è', `<p>${it.what}</p>`)}
    ${sec('Perché esiste', `<p>${it.why}</p>`)}
    ${it.talks && it.talks.length ? sec('Con chi parla', `<ul class="plain">${it.talks.map(t => `<li><span class="badge ${t.kind}">${TALK[t.kind]}</span>${t.text}</li>`).join('')}</ul>`) : ''}
    ${sec('Cosa entra / cosa esce', it.io ? `<p>${it.io}</p>` : '')}
    ${sec('Codice reale', `<div class="files">${(it.files||[]).map(f => `<code>${f}</code>`).join('')}</div>${codeHtml(it.code, it.lang)}`)}
    ${sec('Concetto di Reti', it.net && it.net !== '—' ? `<p>${it.net}</p>` : '')}
    ${sec('Domande da orale', `<ul class="q">${(it.questions||[]).map(q => `<li>${q}</li>`).join('')}</ul>`)}
  `;
  $('#navIdx').addEventListener('click', showIndex);
  $('#navPrev').addEventListener('click', () => i > 0 && showItem(order[i-1]));
  $('#navNext').addEventListener('click', () => i < order.length-1 && showItem(order[i+1]));
  panel.scrollTop = 0;
}

/* Pan & zoom (vanilla) */
const st = { zoom:1, x:0, y:0 }; const drag = { on:false, lx:0, ly:0 };
function apply() { canvas.style.transform = `translate(${st.x}px,${st.y}px) scale(${st.zoom})`; $('#zoomPct').textContent = Math.round(st.zoom*100)+'%'; }
function fit() {
  const svg = diagramEl.querySelector('svg'); if (!svg) return;
  const r = svg.getBoundingClientRect(); const sw = r.width/st.zoom + 80, sh = r.height/st.zoom + 80;
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  st.zoom = Math.max(0.15, Math.min(1.6, Math.min((vw-40)/sw, (vh-120)/sh)));
  st.x = (vw - sw*st.zoom)/2; st.y = Math.max(60, (vh - sh*st.zoom)/2); apply();
}
viewport.addEventListener('wheel', (e) => {
  e.preventDefault(); const r = viewport.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top, f = e.deltaY < 0 ? 1.12 : 1/1.12;
  const nz = Math.min(4, Math.max(0.15, st.zoom*f)), sc = nz/st.zoom;
  st.x = mx - sc*(mx - st.x); st.y = my - sc*(my - st.y); st.zoom = nz; apply();
}, { passive:false });
viewport.addEventListener('pointerdown', (e) => { if (e.target.closest('.node, .messageText, #tldr, #legend, #zoom')) return; drag.on = true; drag.lx = e.clientX; drag.ly = e.clientY; viewport.classList.add('dragging'); viewport.setPointerCapture(e.pointerId); });
viewport.addEventListener('pointermove', (e) => { if (!drag.on) return; st.x += e.clientX - drag.lx; st.y += e.clientY - drag.ly; drag.lx = e.clientX; drag.ly = e.clientY; apply(); });
const endDrag = () => { drag.on = false; viewport.classList.remove('dragging'); };
viewport.addEventListener('pointerup', endDrag); viewport.addEventListener('pointercancel', endDrag);
$('#zoomIn').addEventListener('click', () => { st.zoom = Math.min(4, st.zoom*1.25); apply(); });
$('#zoomOut').addEventListener('click', () => { st.zoom = Math.max(0.15, st.zoom/1.25); apply(); });
$('#zoomFit').addEventListener('click', fit);
window.addEventListener('resize', fit);
$('#tldr').addEventListener('click', () => $('#tldr').classList.toggle('collapsed'));

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return showIndex();
  const order = itemOrder(); const i = activeId ? order.indexOf(activeId) : -1;
  if (e.key === 'ArrowRight') showItem(order[Math.min(order.length-1, i+1)]);
  if (e.key === 'ArrowLeft') showItem(order[Math.max(0, i-1)]);
});

/* Tabs */
$('#tabs').innerHTML = Object.entries(VIEWS).map(([k, v]) => `<button class="tab" data-view="${k}">${v.label}</button>`).join('');
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { location.hash = t.dataset.view; renderView(t.dataset.view); }));

const [initialView, initialItem] = location.hash.slice(1).split('/');
await renderView(VIEWS[initialView] ? initialView : 'arch');
if (initialItem) showItem(initialItem);
</script>
